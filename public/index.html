<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MITAOE SmartAttend</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--navy:#14243a;--blue:#2457d6;--teal:#16a085;--bg:#f3f6fb;--muted:#718096;--line:#e5eaf2;--red:#d94a55;--amber:#bd7917}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--navy)}button,input,select{font:inherit}.shell{max-width:1180px;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:800;font-size:18px}.brand h1{font:800 19px Manrope;margin:0}.brand small{color:var(--muted)}.pill{background:#e9efff;color:var(--blue);border-radius:30px;padding:7px 12px;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.side,.panel,.stat,.login{background:white;border:1px solid var(--line);border-radius:18px}.side{padding:16px;height:max-content}.nav{padding:12px;border-radius:10px;color:#617087;cursor:pointer;margin:4px 0}.nav.active,.nav:hover{background:#edf2ff;color:var(--blue);font-weight:700}.main{min-width:0}.welcome{background:linear-gradient(120deg,#14243a,#2457d6);color:white;padding:26px;border-radius:20px;margin-bottom:18px}.welcome h2{font:800 24px Manrope;margin:0 0 6px}.welcome p{opacity:.8;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font:800 27px Manrope;margin-top:8px}.panel{padding:20px;margin-bottom:18px}.panel h3{margin:0 0 16px;font:700 17px Manrope}.course{border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}.coursehead{display:flex;justify-content:space-between;gap:12px}.course h4{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.bar{height:9px;background:#edf0f5;border-radius:9px;margin:13px 0 8px;overflow:hidden}.bar span{display:block;height:100%;border-radius:9px;background:var(--teal)}.bar.low span{background:var(--red)}.badge{font-size:12px;font-weight:700;padding:6px 9px;border-radius:30px;background:#e7f7f1;color:#14815f}.badge.low{background:#fff0f0;color:var(--red)}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:11px 15px;font-weight:700;cursor:pointer}.btn.secondary{background:#edf2ff;color:var(--blue)}.btn.dark{background:var(--navy)}.btn.danger{background:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field select{padding:11px;border:1px solid var(--line);border-radius:10px;min-width:0}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);padding:30px}.login h2{font:800 25px Manrope}.login .field input{width:100%}.notice{padding:13px 15px;border-radius:12px;background:#fff6e7;color:#8a5b13;margin:12px 0;font-size:13px}.success{background:#e8f8f1;color:#147553}.error{background:#fff0f0;color:#b3313d}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}.hidden{display:none!important}.qrbox{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.qrbox img{width:220px;height:220px;border:1px solid var(--line);padding:8px;border-radius:12px}.notification{padding:13px;border-bottom:1px solid var(--line)}.notification b{display:block}.small{font-size:12px;color:var(--muted)}.footer{text-align:center;color:#8a96a8;font-size:12px;padding:18px}@media(max-width:760px){.shell{padding:14px}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.nav{white-space:nowrap}.stats{grid-template-columns:1fr 1fr}.welcome h2{font-size:20px}.top{align-items:flex-start}.top .pill{display:none}}
</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>
